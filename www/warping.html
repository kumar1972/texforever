<script>
let editingWarpId = null;

function checkUserPermission() {
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['warping.html'] === false || permissions['warping'] === false) {
            return false;
        }
    }
    return true;
}

document.addEventListener('DOMContentLoaded', function() {
    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission to access this page. ❌");
        window.location.href = "dashboard.html";
        return;
    }

    document.getElementById('topDate').valueAsDate = new Date();
    document.getElementById('botDate').valueAsDate = new Date();
    loadWarpingUnitSuggestions();
    loadWeaverSuggestions();
    loadTopDesignDropdown();
    loadBottomOrderDropdown();
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
    if(modalId === 'savedListModal') {
        renderCards(); 
    }
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

window.openFullscreenImage = function(src) {
    if(!src || src === '' || src === 'null') return;
    document.getElementById('fullscreenImg').src = src;
    document.getElementById('fullscreenModal').style.display = 'flex';
};
window.closeFullscreenImage = function() {
    document.getElementById('fullscreenModal').style.display = 'none';
};

function loadBitmapImage() {
    let activeDesign = document.getElementById('topDesignNo').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let clean = activeDesign ? activeDesign.toString().replace('#', '').trim().toLowerCase() : '';
    let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === clean) || activeDesign;

    let imgHtml = '';
    if (activeDesign && designSpecs[specKey] && designSpecs[specKey].bitmap) {
        let b64 = designSpecs[specKey].bitmap;
        imgHtml = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    }
    
    bitmapContainer.innerHTML = imgHtml;
}

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function parseYarnCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return [];
    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        for(let k=0; k<val; k++) exactSequence.push({ count: cDisplay, color: clr });
    });

    let summaryMap = new Map();
    let order = [];
    exactSequence.forEach(item => {
        let key = item.count.toLowerCase() + "||" + item.color.toLowerCase().trim();
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color.trim(), patternVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return order.map(k => summaryMap.get(k));
}

function addWarpingUnit() {
    let val = prompt("புதிய Warping Unit பெயரை உள்ளிடவும்:");
    if(val) {
        val = val.trim();

function loadTopDesignSpecs(dNo) {
    loadBitmapImage();
    if(!dNo) {
        document.getElementById('topLinesContainer').innerHTML = '';
        document.getElementById('topDesignNo').value = '';
        document.getElementById('topUnit').value = '';
        if(document.getElementById('topWeaverTo')) document.getElementById('topWeaverTo').value = '';
        document.getElementById('topOnloomReed').value = '';
        document.getElementById('topOnloomWidth').value = '';
        document.getElementById('topCount1').value = '';
        document.getElementById('topCount2').value = '';
        document.getElementById('topOrderMtrs').value = '';
        document.getElementById('topWarpingMts').value = '';
        return;
    }
    
    localStorage.setItem('selected_design_number', dNo);
    
    let cleanDNo = cleanDesignName(dNo);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let found = Array.isArray(designMastersList) ? designMastersList.find(d => cleanDesignName(d.name || d.designNo) === cleanDNo) || {} : {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo) || dNo;
    let sp = specs[specKey] || {};

    let partyOrders = JSON.parse(localStorage.getItem('party_orders_data')) || [];
    let matchedOrder = Array.isArray(partyOrders) ? partyOrders.find(o => cleanDesignName(o.designNumber || o.designNo) === cleanDNo) || {} : {};

    let specStatus = (sp.status || matchedOrder.status || '').toLowerCase();
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let rec = issues.find(r => cleanDesignName(r.designNo || r.designNumber) === cleanDNo);

    let cb = document.getElementById('top_completed_status');
    if(specStatus === 'completed' || (rec && (rec.status || '').toLowerCase() === 'completed')) {
        if(cb) cb.checked = true;
    } else {
        if(cb) cb.checked = false;
    }

    let baseReed = parseFloat(found.reed || sp.reed || matchedOrder.reed) || 0;
    let baseWidth = parseFloat(found.width || sp.width || sp.finishWidth || matchedOrder.width) || 0;
    
    let savedOnloomReed = sp.onloomReed || found.onloomReed || matchedOrder.onloomReed;
    let savedOnloomWidth = sp.onloomWidth || found.onloomWidth || matchedOrder.onloomWidth;

    let finalOnloomReed = savedOnloomReed ? parseFloat(savedOnloomReed) : (baseReed > 0 ? baseReed - 8 : 0);
    let finalOnloomWidth = savedOnloomWidth ? parseFloat(savedOnloomWidth) : (baseWidth > 0 && baseReed > 0 && finalOnloomReed > 0 ? (baseReed * baseWidth) / finalOnloomReed : baseWidth);

    document.getElementById('topOnloomReed').value = finalOnloomReed || '';
    document.getElementById('topOnloomWidth').value = finalOnloomWidth ? parseFloat(finalOnloomWidth).toFixed(2) : '';

    document.getElementById('topCount1').value = found.warp1 || sp.baseBeamCount || matchedOrder.baseBeamCount || sp.warp || found.count1 || '';
    document.getElementById('topCount2').value = found.warp2 || sp.topBeamCount || matchedOrder.topBeamCount || sp.warp2 || found.count2 || '';

    // 🟢 1. Total Dyeing Mtr - 5% = Order Mtrs 🟢
    let totalDyeingMtr = parseFloat(sp.totalDyeingMtr) || parseFloat(matchedOrder.orderMtr || matchedOrder.productionMeter || matchedOrder.prodMtr || sp.yarnOrderMtr || sp.orderMtr || found.orderMtr) || 0;
    let orderMtrsCalc = totalDyeingMtr > 0 ? (totalDyeingMtr * 0.95) : 0;
    document.getElementById('topOrderMtrs').value = orderMtrsCalc > 0 ? orderMtrsCalc.toFixed(2) : '';

    // 🟢 2. Warping Mtrs ALWAYS EMPTY FOR MANUAL ENTRY on Design Select 🟢
    if (!editingWarpId) {
        document.getElementById('topWarpingMts').value = '';
        document.getElementById('topUnit').value = '';
        if(document.getElementById('topWeaverTo')) document.getElementById('topWeaverTo').value = '';
    }

    loadTopYarnLines();
}

function loadTopYarnLines() {
    if(editingWarpId) return; 
    
    let dNo = document.getElementById('topDesignNo').value;
    let container = document.getElementById('topLinesContainer');
    container.innerHTML = '';
    if(!dNo) return;

    let cleanDNo = cleanDesignName(dNo);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let found = Array.isArray(designMastersList) ? designMastersList.find(d => cleanDesignName(d.name || d.designNo) === cleanDNo) || {} : {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo) || dNo;
    let sp = specs[specKey] || {};

    let oReed = parseFloat(document.getElementById('topOnloomReed').value) || 0;
    let oWidth = parseFloat(document.getElementById('topOnloomWidth').value) || 0;
    let totalWarpEnds = Math.round(oReed * oWidth);
    
    let warpingMts = parseFloat(document.getElementById('topWarpingMts').value) || 0;
    let defaultWarpCount = document.getElementById('topCount1').value || '20';

    let warpList = resolvePattern(found.warpLines || [], found.warpRanges || [], 'warp', defaultWarpCount);
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let existingIssues = issues.filter(i => cleanDesignName(i.designNo) === cleanDNo);
    let dyeingReceives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];

    if(warpList.length > 0) {
        let totalPatternVal = warpList.reduce((a, b) => a + b.patternVal, 0) || 1;
        warpList.forEach(item => {
            let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWarpCount) || 20;
            let totalEndsForColor = item.patternVal * Math.floor(totalWarpEnds / totalPatternVal);
            let weightKg = (totalEndsForColor * warpingMts) / (1693.33 * calcCount);

            let matchedExisting = existingIssues.find(i => 
                i.count && item.count && i.count.trim().toLowerCase() === item.count.trim().toLowerCase() &&
                i.color && item.color && i.color.trim().toLowerCase() === item.color.trim().toLowerCase()
            );

            let matchedDyeRec = dyeingReceives.find(r => cleanDesignName(r.designNo) === cleanDNo && r.color && item.color && r.color.trim().toLowerCase() === item.color.trim().toLowerCase());
            if (!matchedDyeRec) matchedDyeRec = dyeingReceives.find(r => cleanDesignName(r.designNo) === cleanDNo);

            let initialWt = matchedExisting ? parseFloat(matchedExisting.issueWt) : (matchedDyeRec ? parseFloat(matchedDyeRec.receivedWt || matchedDyeRec.netWt) : weightKg);

            let row = document.createElement('div');
            row.className = 'line-row';
            row.innerHTML = `
                <input type="text" class="t-count" value="${item.count}" readonly>
                <input type="text" class="t-color" value="${item.color}" readonly>
                <input type="number" class="t-orderwt" value="${weightKg.toFixed(3)}" step="0.001" readonly>
                <input type="number" class="t-isswt" value="${initialWt.toFixed(3)}" step="0.001">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        });
    }
}

async function saveTopOrder() {

    let dNo = document.getElementById('topDesignNo').value;
    let weaverTo = document.getElementById('topWeaverTo') ? document.getElementById('topWeaverTo').value.trim() : '';

    if(!dNo || !unit) { alert("Please fill Warping Unit and Design Number!"); return; }

    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let cleanDNo = cleanDesignName(dNo);

    if(editingWarpId) {
        issues = issues.filter(i => !(cleanDesignName(i.designNo) === cleanDNo && i.unit === unit));
    } else {
        let alreadyExists = issues.some(i => cleanDesignName(i.designNo) === cleanDNo && i.unit === unit);
        if(alreadyExists) {
            issues = issues.filter(i => !(cleanDesignName(i.designNo) === cleanDNo && i.unit === unit));
        }
    }

    let btn = document.getElementById('saveTopBtnTxt');
    let origText = btn.innerText;
    btn.innerText = "⏳ Saving...";

    let rows = document.querySelectorAll('#topLinesContainer .line-row');
    let savedCount = 0;

    rows.forEach(row => {
        let count = row.querySelector('.t-count').value.trim();
        let color = row.querySelector('.t-color').value.trim();
        let orderWt = parseFloat(row.querySelector('.t-orderwt').value) || 0;
        let issWt = parseFloat(row.querySelector('.t-isswt').value) || 0;

        if(count && issWt > 0) {
            issues.push({
                id: Date.now() + Math.random(),
                date: dateVal,
                unit: unit,
                designNo: dNo,
                weaverTo: weaverTo,
                warpingMts: warpingMts,
                count: count,
                color: color,
                orderWt: orderWt.toFixed(3),
                issueWt: issWt.toFixed(3),
                status: isCompleted ? 'completed' : 'running'
            });
            savedCount++;
        }
    });

    if(savedCount > 0) {
        let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
        let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === cleanDNo) || dNo;
        if(!designSpecs[specKey]) designSpecs[specKey] = {};
        designSpecs[specKey].status = isCompleted ? 'completed' : 'running';
        
        localStorage.setItem('design_specs', JSON.stringify(designSpecs));
        localStorage.setItem('warping_issue_records', JSON.stringify(issues));
        
        if (window.supabaseSave) {
            await window.supabaseSave('warping_issue_records', issues);
            await window.supabaseSave('design_specs', designSpecs);
        }
        
        alert(editingWarpId ? "Warping Order Updated Successfully! ✅" : "Warping Order Saved Successfully! ✅");
        
        editingWarpId = specKey = null;
        document.getElementById('topDesignNo').value = '';
        document.getElementById('topUnit').value = '';
        document.getElementById('topWarpingMts').value = '';
        document.getElementById('topLinesContainer').innerHTML = '';
        document.getElementById('top_completed_status').checked = false;
        renderCards();
    } else {
        alert("Please enter Issued Weight.");
    }
    btn.innerText = origText;
}

                <button class="${statusBtnClass}" onclick="toggleStatusForGroup('${group.designNo}', '${group.unit}', '${nextStatus}')">${statusBtnText}</button>
                <button class="btn-card-edit" onclick="editWarpingGroup('${group.designNo}', '${group.unit}')">Edit</button>
                <button class="btn-card-del" onclick="deleteWarpingGroup('${group.designNo}', '${group.unit}')">Delete</button>
            </div>
        `;
        container.appendChild(card);
    });
}

async function toggleStatusForGroup(dNo, unitName, newStatus) {
    if(confirm(`Change status to ${newStatus}?`)) {
        let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
        issues.forEach(r => { if(cleanDesignName(r.designNo) === cleanDesignName(dNo) && r.unit === unitName) r.status = newStatus; });
        localStorage.setItem('warping_issue_records', JSON.stringify(issues));
        if(window.supabaseSave) await window.supabaseSave('warping_issue_records', issues);
        renderCards();
    }
}

function editWarpingGroup(dNo, unitName) {
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let targetIssues = issues.filter(i => cleanDesignName(i.designNo) === cleanDesignName(dNo) && i.unit === unitName);
    
    if(targetIssues.length > 0) {
        let targetIssue = targetIssues[0];
        editingWarpId = targetIssue.id;

        document.getElementById('topDate').value = targetIssue.date;
        document.getElementById('topUnit').value = targetIssue.unit;
        document.getElementById('topDesignNo').value = targetIssue.designNo;
        if(targetIssue.weaverTo) document.getElementById('topWeaverTo').value = targetIssue.weaverTo;
        if(targetIssue.warpingMts) document.getElementById('topWarpingMts').value = targetIssue.warpingMts;
        
        document.getElementById('top_completed_status').checked = (targetIssue.status === 'completed');
        loadTopDesignSpecs(targetIssue.designNo);

        let container = document.getElementById('topLinesContainer');
        container.innerHTML = '';
        targetIssues.forEach(item => {
            let row = document.createElement('div');
            row.className = 'line-row';
            row.innerHTML = `
                <input type="text" class="t-count" value="${item.count}" readonly>
                <input type="text" class="t-color" value="${item.color}" readonly>
                <input type="number" class="t-orderwt" value="${item.orderWt}" step="0.001" readonly>
                <input type="number" class="t-isswt" value="${item.issueWt}" step="0.001">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        });

        closeModal('savedListModal');
        document.getElementById('saveTopBtnTxt').innerText = "🔄 Update Top Order";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

async function deleteWarpingGroup(dNo, unitName) {
    if(!confirm("Are you sure you want to delete this entry?")) return;
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    issues = issues.filter(i => !(cleanDesignName(i.designNo) === cleanDesignName(dNo) && i.unit === unitName));
    localStorage.setItem('warping_issue_records', JSON.stringify(issues));
    if (window.supabaseSave) await window.supabaseSave('warping_issue_records', issues);
    renderCards();
}

// Masters helpers
function addWarpingUnit() {
    let val = prompt("புதிய Warping Unit பெயரை உள்ளிடவும்:");
    if(val && val.trim()) {
        let masterUnits = JSON.parse(localStorage.getItem('tex_master_warping_units')) || [];
        if(!masterUnits.includes(val.trim())) {
            masterUnits.push(val.trim());
            localStorage.setItem('tex_master_warping_units', JSON.stringify(masterUnits));
            if (window.supabaseSave) window.supabaseSave('tex_master_warping_units', masterUnits);
            loadWarpingUnitSuggestions();
            document.getElementById('topUnit').value = val.trim();
        }
    }
}
function deleteWarpingUnit() {
    let masterList = JSON.parse(localStorage.getItem('tex_master_warping_units')) || [];
    if(masterList.length === 0) return;
    let idxStr = prompt(`நீக்க வேண்டிய எண்ணை உள்ளிடவும்:\n` + masterList.map((m, i) => `${i + 1}. ${m}`).join('\n'));
    if(idxStr) {
        let idx = parseInt(idxStr) - 1;
        if(idx >= 0 && idx < masterList.length) {
            masterList.splice(idx, 1);
            localStorage.setItem('tex_master_warping_units', JSON.stringify(masterList));
            if (window.supabaseSave) window.supabaseSave('tex_master_warping_units', masterList);
            loadWarpingUnitSuggestions();
        }
    }
}
function loadWarpingUnitSuggestions() {
    let masterUnits = JSON.parse(localStorage.getItem('tex_master_warping_units')) || [];
    let html = '<option value="">Select Unit</option>';
    masterUnits.forEach(u => html += `<option value="${u}">${u}</option>`);
    document.getElementById('topUnit').innerHTML = html;
}

    if(idxStr) {
        let idx = parseInt(idxStr) - 1;
        if(idx >= 0 && idx < masterList.length) {
            masterList.splice(idx, 1);
            localStorage.setItem('tex_master_weavers', JSON.stringify(masterList));
            if (window.supabaseSave) window.supabaseSave('tex_master_weavers', masterList);
            loadWeaverSuggestions();
        }
    }
}
function loadWeaverSuggestions() {

    let html = '<option value="">Select Weaver / Party</option>';
