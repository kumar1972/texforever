<style>

<script>
let editingWarpId = null;
let allCombinedDesigns = [];
let allCombinedWeavers = [];

function checkUserPermission() {
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['warping.html'] === false || permissions['warping'] === false) {
            return false;
        }
    }
    return true;
}

document.addEventListener('DOMContentLoaded', async function() {
    if (window.StorageDB && window.StorageDB.ready) await window.StorageDB.ready;
    if (!checkUserPermission()) {
        alert("Access Denied! ❌");
        window.location.href = "dashboard.html";
        return;
    }

    document.getElementById('topDate').valueAsDate = new Date();
    document.getElementById('botDate').valueAsDate = new Date();
    loadWarpingUnitSuggestions();
    loadWeaverSuggestions();
    await loadTopDesignDropdown();
    loadBottomOrderDropdown();
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
    if(modalId === 'savedListModal') renderCards();
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function parseYarnCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            return (parseFloat(parts[1]) || 1) / (parseFloat(parts[0]) || 1); 
        }
    }
    return parseFloat(str) || 0;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return [];
    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        for(let k=0; k<val; k++) exactSequence.push({ count: cDisplay, color: clr });
    });

    let summaryMap = new Map();
    let order = [];
    exactSequence.forEach(item => {
        let key = item.count.toLowerCase() + "||" + item.color.toLowerCase().trim();
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color.trim(), patternVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return order.map(k => summaryMap.get(k));
}

function loadWarpingUnitSuggestions() {
    let masterUnits = JSON.parse(window.StorageDB.getItem('tex_master_warping_units')) || [];
    let issues = JSON.parse(window.StorageDB.getItem('warping_issue_records')) || [];
    let unitSet = new Set([...masterUnits]);
    issues.forEach(item => { if(item.unit) unitSet.add(item.unit.trim()); });

    let currentVal = document.getElementById('topUnit').value;
    let html = '<option value="">Select Unit</option>';
    Array.from(unitSet).sort().forEach(u => { 
        html += `<option value="${u}">${u}</option>`; 
    });
    document.getElementById('topUnit').innerHTML = html;
    if(currentVal) document.getElementById('topUnit').value = currentVal;
}

function loadWeaverSuggestions() {
    let masterWeavers = JSON.parse(window.StorageDB.getItem('tex_master_weavers')) || [];
    let issues = JSON.parse(window.StorageDB.getItem('warping_issue_records')) || [];
    let weaverSet = new Set([...masterWeavers]);
    issues.forEach(item => { if(item.weaverTo) weaverSet.add(item.weaverTo.trim()); });
    allCombinedWeavers = Array.from(weaverSet).filter(Boolean).sort();
}

async function loadTopDesignDropdown() {
    let allDesignSet = new Set();
    let preDesignList = JSON.parse(window.StorageDB.getItem('pre_design_numbers')) || [];
    preDesignList.forEach(d => allDesignSet.add(d));

    let designMasters = JSON.parse(window.StorageDB.getItem('design_masters_data')) || [];
    if (Array.isArray(designMasters)) designMasters.forEach(d => { if(d.name || d.designNo) allDesignSet.add(d.name || d.designNo); });

    let designSpecs = JSON.parse(window.StorageDB.getItem('design_specs')) || {};
    Object.keys(designSpecs).forEach(d => allDesignSet.add(d));

    allCombinedDesigns = Array.from(allDesignSet).filter(Boolean).sort();
    let select = document.getElementById('topDesignNo');
    if(select) {
        let html = '<option value="">Select Design</option>';
        allCombinedDesigns.forEach(d => { html += `<option value="${d}">${d}</option>`; });
        select.innerHTML = html;
    }
}

function loadTopDesignSpecs(dNo) {
    if(!dNo) return;
    window.StorageDB.setItem('selected_design_number', dNo);
    let cleanDNo = cleanDesignName(dNo);
    let designMastersList = JSON.parse(window.StorageDB.getItem('design_masters_data')) || [];
    let found = Array.isArray(designMastersList) ? designMastersList.find(d => cleanDesignName(d.name || d.designNo) === cleanDNo) || {} : {};
    let specs = JSON.parse(window.StorageDB.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo) || dNo;
    let sp = specs[specKey] || {};

    let baseReed = parseFloat(found.reed || sp.reed) || 0;
    let baseWidth = parseFloat(found.width || sp.width) || 0;
    let finalOnloomReed = baseReed > 0 ? baseReed - 8 : 0;
    let finalOnloomWidth = baseWidth > 0 ? baseWidth : 0;

    document.getElementById('topOnloomReed').value = finalOnloomReed || '';
    document.getElementById('topOnloomWidth').value = finalOnloomWidth ? parseFloat(finalOnloomWidth).toFixed(2) : '';
    document.getElementById('topCount1').value = found.warp1 || sp.baseBeamCount || '';
    document.getElementById('topCount2').value = found.warp2 || sp.topBeamCount || '';

    let totalDyeingMtr = parseFloat(sp.totalDyeingMtr) || 0;
    let orderMtrsCalc = totalDyeingMtr > 0 ? (totalDyeingMtr * 0.95) : 0;
    document.getElementById('topOrderMtrs').value = orderMtrsCalc > 0 ? orderMtrsCalc.toFixed(2) : '';
    loadTopYarnLines();
}

function loadTopYarnLines() {
    let dNo = document.getElementById('topDesignNo').value;
    let container = document.getElementById('topLinesContainer');
    container.innerHTML = '';
    if(!dNo) return;

    let cleanDNo = cleanDesignName(dNo);
    let designMastersList = JSON.parse(window.StorageDB.getItem('design_masters_data')) || [];
    let found = Array.isArray(designMastersList) ? designMastersList.find(d => cleanDesignName(d.name || d.designNo) === cleanDNo) || {} : {};
    let oReed = parseFloat(document.getElementById('topOnloomReed').value) || 0;
    let oWidth = parseFloat(document.getElementById('topOnloomWidth').value) || 0;
    let totalWarpEnds = Math.round(oReed * oWidth);
    let warpingMts = parseFloat(document.getElementById('topWarpingMts').value) || 0;
    let defaultWarpCount = document.getElementById('topCount1').value || '20';

    let warpList = resolvePattern(found.warpLines || [], found.warpRanges || [], 'warp', defaultWarpCount);
    if(warpList.length > 0) {
        let totalPatternVal = warpList.reduce((a, b) => a + b.patternVal, 0) || 1;
        warpList.forEach(item => {
            let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWarpCount) || 20;
            let totalEndsForColor = item.patternVal * Math.floor(totalWarpEnds / totalPatternVal);
            let weightKg = (totalEndsForColor * warpingMts) / (1693.33 * calcCount);

            let row = document.createElement('div');
            row.className = 'line-row';
            row.innerHTML = `
                <input type="text" class="t-count" value="${item.count}" readonly>
                <input type="text" class="t-color" value="${item.color}" readonly>
                <input type="number" class="t-orderwt" value="${weightKg.toFixed(3)}" step="0.001" readonly>
                <input type="number" class="t-isswt" value="${weightKg.toFixed(3)}" step="0.001">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        });
    }
}

async function saveTopOrder() {
    let dateVal = document.getElementById('topDate').value;
    let unit = document.getElementById('topUnit').value.trim();
    let dNo = document.getElementById('topDesignNo').value;
    let weaverTo = document.getElementById('topWeaverTo').value.trim();
    let warpingMts = document.getElementById('topWarpingMts').value;
    let isCompleted = document.getElementById('top_completed_status').checked;

    if(!dNo || !unit) { alert("Please fill Unit and Design No!"); return; }

    let issues = JSON.parse(window.StorageDB.getItem('warping_issue_records')) || [];
    issues = issues.filter(i => !(cleanDesignName(i.designNo) === cleanDesignName(dNo) && i.unit === unit));

    let rows = document.querySelectorAll('#topLinesContainer .line-row');
    rows.forEach(row => {
        let count = row.querySelector('.t-count').value.trim();
        let color = row.querySelector('.t-color').value.trim();
        let orderWt = parseFloat(row.querySelector('.t-orderwt').value) || 0;
        let issWt = parseFloat(row.querySelector('.t-isswt').value) || 0;

        issues.push({
            id: Date.now() + Math.random(),
            date: dateVal,
            unit: unit,
            designNo: dNo,
            weaverTo: weaverTo,
            warpingMts: warpingMts,
            count: count,
            color: color,
            orderWt: orderWt.toFixed(3),
            issueWt: issWt.toFixed(3),
            status: isCompleted ? 'completed' : 'running'
        });
    });

    window.StorageDB.setItem('warping_issue_records', JSON.stringify(issues));
    if (window.supabaseSave) await window.supabaseSave('warping_issue_records', issues);
    alert("Warping Order Saved Successfully! ✅");
    renderCards();
}

function renderCards() {
    let issues = JSON.parse(window.StorageDB.getItem('warping_issue_records')) || [];
    let container = document.getElementById('savedCardsContainer');
    container.innerHTML = '';
    
    let groupMap = new Map();
    issues.forEach(issue => {
        let groupKey = `${cleanDesignName(issue.designNo)}_${issue.unit}`;
        if(!groupMap.has(groupKey)) {
            groupMap.set(groupKey, { date: issue.date, unit: issue.unit, designNo: issue.designNo, status: issue.status || 'running' });
        }
    });

    groupMap.forEach((group) => {
        let card = document.createElement('div');
        card.className = "saved-warp-card";
        card.innerHTML = `
            <div class="saved-warp-top">
                <div><b>${group.designNo}</b><br><small>Unit: ${group.unit} | Date: ${group.date}</small></div>
                <span>${group.status}</span>
            </div>
        `;
        container.appendChild(card);
    });
}
</script>
