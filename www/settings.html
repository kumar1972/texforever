<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}

html,body{width:100%;min-height:100vh;background:#030712;color:#1E2B23;}

body{padding:12px;display:flex;flex-direction:column;align-items:center;}

.container{
    width:100%;max-width:900px;background:#fff;padding:20px;border-radius:20px;
    box-shadow:0 10px 35px rgba(30,43,35,.06);border:1px solid rgba(82,110,81,.15);
    display:flex;flex-direction:column;gap:16px;
}

.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}

.back-btn{
    display:inline-flex;align-items:center;gap:5px;color:#fff;text-decoration:none;
    font-weight:600;font-size:11px;background:#1A2421;padding:8px 16px;border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.page-title{
    font-size:18px;margin-bottom:5px;font-weight:800;color:#2F4F38;text-align:center;
    text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #EAF0EA;padding-bottom:12px;

.form-section{

}

.section-badge{

}
.section-badge.blue{background:linear-gradient(135deg,#3B82F6,#1D4ED8);}
.section-badge.amber{background:linear-gradient(135deg,#F59E0B,#D97706);}
.section-badge.danger{background:linear-gradient(135deg,#EF4444,#DC2626);}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;}

.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.form-group label{font-size:11px;font-weight:700;color:#4A554A;}

input,select,textarea{

    color:#1E2B23;font-size:12px;font-weight:600;outline:none;
}
textarea{resize:vertical;height:80px;}
input:focus,select:focus,textarea:focus{border-color:#4A7C59;box-shadow:0 0 0 3px rgba(74,124,89,.15);}

.checkbox-group-container{
    background:#fff;border:1px solid #D1DED1;border-radius:10px;padding:15px;

}
.checkbox-item{

}
.checkbox-item input[type=checkbox]{width:16px;height:16px;accent-color:#EF4444;}

.users-table-container{margin-top:15px;background:#fff;border-radius:10px;overflow-x:auto;border:1px solid #D1DED1;}
.users-table{width:100%;border-collapse:collapse;font-size:11px;text-align:center;}
.users-table th,.users-table td{padding:10px;border-bottom:1px solid #E2E8E2;color:#1E2B23;}
.users-table th{background:#EAF0EA;color:#2F4F38;font-weight:700;text-transform:uppercase;}

input[type=file]{padding:8px;background:#F4F7F4;border:1px dashed #4A7C59;cursor:pointer;}
input[type=file]::file-selector-button{
    background:#4A7C59;color:#fff;border:0;padding:6px 14px;border-radius:6px;
    font-weight:600;font-size:10px;cursor:pointer;margin-right:10px;
}

.preview-box{

    border:1px solid #D1DED1;display:none;align-items:center;justify-content:center;overflow:hidden;
}
.preview-box img{display:block;max-width:100%;width:auto;height:auto;max-height:120px;object-fit:contain;border-radius:6px;}

.logo-status{margin-top:7px;font-size:10px;font-weight:600;text-align:center;color:#4A7C59;}

.btn-action{

.btn-action:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,#4A7C59,#2F4F38);}
.btn-success{background:linear-gradient(135deg,#10B981,#059669);}

}
</style>

<script>
"use strict";

/* ============================================================
   TEX FOR EVER SETTINGS
============================================================ */

let tempLogoData = "";
let tempDesignBitmapData = "";
let settingsInitialized = false;
let saveAllRunning = false;

/* CONSTANTS */
const LOGO_MAX_WIDTH = 512;
const LOGO_MAX_HEIGHT = 512;
const RAW_FILE_SIZE_LIMIT = 8 * 1024 * 1024;
const DESIGN_MAX_WIDTH = 800;
const DESIGN_MAX_HEIGHT = 800;
const MAX_IMAGE_BYTES = 350 * 1024;

/* INDEXEDDB HELPER */
const DB_NAME = "TexForEverDB";
const STORE_NAME = "erp_store";
const DB_VERSION = 1;

function openIndexedDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
    });
}

async function idbGet(key) {
    try {
        const db = await openIndexedDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const request = tx.objectStore(STORE_NAME).get(key);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    } catch (e) {
        return null;
    }
}

async function idbSet(key, value) {
    try {
        const db = await openIndexedDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            const request = tx.objectStore(STORE_NAME).put(value, key);
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
        });
    } catch (e) {
        return false;
    }
}

async function idbGetAll() {
    try {
        const db = await openIndexedDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const requestID = store.getAllKeys();
            const requestVal = store.getAll();
            tx.oncomplete = () => {
                const keys = requestID.result;
                const values = requestVal.result;
                const result = {};
                for (let i = 0; i < keys.length; i++) {
                    result[keys[i]] = values[i];
                }
                resolve(result);
            };
            tx.onerror = () => reject(tx.error);
        });
    } catch (e) {
        return {};
    }
}

/* GET ELEMENT */
function $(id) {
    return document.getElementById(id);
}

/* STATUS */
function status(message, ok = true) {
    const el = $("settingsStatus");
    if (!el) return;
    el.textContent = message;
    el.style.color = ok ? "#2563EB" : "#DC2626";
}

/* SAVE PROGRESS */
function saveProgress(message) {
    const el = $("saveProgress");
    if (!el) return;
    el.style.display = "block";
    el.textContent = message;
}

function hideSaveProgress() {
    const el = $("saveProgress");
    if (el) el.style.display = "none";
}

/* SAFE LOAD */
function safeLoad(key, fallback) {
    try {
        if (typeof window.localLoad === "function") {
            return window.localLoad(key, fallback);
        }
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        try {
            return JSON.parse(raw);
        } catch (e) {
            return raw;
        }
    } catch (e) {
        return fallback;
    }
}

/* SAFE SAVE */
function safeSave(key, value) {
    try {
        if (typeof window.localSave === "function") {
            return window.localSave(key, value);
        }
        localStorage.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
        idbSet(key, value);
        return true;
    } catch (e) {
        return false;
    }
}

/* CLOUD SAVE */
async function pageCloudSave(key, value) {
    try {
        if (typeof window.supabaseSave === "function") {
            return await window.supabaseSave(key, value);
        }
        return safeSave(key, value);
    } catch (e) {
        console.warn("Cloud save fallback:", key, e);
        safeSave(key, value);
        return true;
    }
}

/* TEXT CLEAN */
function cleanInputText(v) {
    return v == null ? "" : String(v).replace(/\\/g, "").replace(/"/g, "").trim();
}

/* NORMALIZE IMAGE */
function normalizeImageData(value) {
    if (!value) return "";
    let data = String(value).trim();
    if ((data.startsWith('"') && data.endsWith('"')) || (data.startsWith("'") && data.endsWith("'"))) {
        data = data.slice(1, -1);
    }
    data = data.replace(/\\"/g, '"').trim();
    if (/^(data:image\/|blob:|https?:\/\/)/i.test(data)) {
        return data;
    }
    return "";
}

/* IMAGE SIZE */
function getDataUrlBytes(dataUrl) {
    try {
        if (!dataUrl || !dataUrl.startsWith("data:")) return 0;
        const base64 = dataUrl.split(",")[1] || "";
        return Math.floor((base64.length * 3) / 4);
    } catch (e) {
        return 0;
    }
}

/* IMAGE COMPRESSION */
function compressImageSafe(file, maxW, maxH, callback) {

    if (!file) { callback(""); return; }
    if (!file.type || !file.type.startsWith("image/")) { callback(""); return; }

    function renderToDataUrl(source, w, h) {
        try {
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d", { alpha: true });
            if (!ctx) { callback(""); return; }

            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(source, 0, 0, w, h);

            let result = "";
            try {
                result = canvas.toDataURL("image/webp", 0.78);
            } catch (e) {
                result = "";
            }

            if (!result || !result.startsWith("data:image/")) {
                try {
                    const c = document.createElement("canvas");
                    c.width = w;
                    c.height = h;
                    const cctx = c.getContext("2d");
                    cctx.fillStyle = "#FFFFFF";
                    cctx.fillRect(0, 0, w, h);
                    cctx.drawImage(source, 0, 0, w, h);
                    result = c.toDataURL("image/jpeg", 0.78);
                } catch (err) {
                    result = "";
                }
            }

            if (getDataUrlBytes(result) > MAX_IMAGE_BYTES) {
                const qualities = [0.65, 0.55, 0.45, 0.35];
                for (const q of qualities) {
                    try {
                        const smaller = canvas.toDataURL("image/webp", q);
                        if (getDataUrlBytes(smaller) < getDataUrlBytes(result)) {
                            result = smaller;
                        }
                        if (getDataUrlBytes(result) <= MAX_IMAGE_BYTES) break;
                    } catch (err) {}
                }
            }

            if (getDataUrlBytes(result) > MAX_IMAGE_BYTES) {
                alert("Image is still too large.\n\nPlease select a smaller image.");
                callback("");
                return;
            }

            if (source && typeof source.close === "function") {
                try { source.close(); } catch (e) {}
            }

            callback(normalizeImageData(result));

        } catch (error) {
            console.error("Image compression:", error);
            callback("");
        }
    }

    function fallbackViaImageElement() {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = function () {
            URL.revokeObjectURL(objectUrl);
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (!w || !h) { callback(""); return; }
            const scale = Math.min(1, maxW / w, maxH / h);
            w = Math.max(1, Math.round(w * scale));
            h = Math.max(1, Math.round(h * scale));
            renderToDataUrl(img, w, h);
        };

        img.onerror = function () {
            URL.revokeObjectURL(objectUrl);
            callback("");
        };

        img.src = objectUrl;
    }

    if (typeof createImageBitmap === "function") {

        const SAFE_DECODE_CEILING = 1024;

        /* FIX #2: only resizeWidth is passed, so the aspect ratio is preserved
           (previously resizeWidth + resizeHeight forced every image to 1024x1024) */
        createImageBitmap(file, {
            resizeWidth: SAFE_DECODE_CEILING,
            resizeQuality: "medium"
        })
        .then(function (bitmap) {
            const w = bitmap.width;
            const h = bitmap.height;
            const scale = Math.min(1, maxW / w, maxH / h);
            const targetW = Math.max(1, Math.round(w * scale));
            const targetH = Math.max(1, Math.round(h * scale));
            renderToDataUrl(bitmap, targetW, targetH);
        })
        .catch(function () {
            fallbackViaImageElement();
        });

        return;
    }

    fallbackViaImageElement();
}

/* TOAST */
function toast(message, ok = true, callback) {
    try {
        const old = $("customToast");
        if (old) old.remove();

        const t = document.createElement("div");
        t.id = "customToast";
        t.textContent = (ok ? "✅ " : "⚠️ ") + message;

        Object.assign(t.style, {
            position: "fixed",
            top: "20px",
            left: "50%",
            transform: "translateX(-50%)",
            background: ok ? "#10B981" : "#DC2626",
            color: "#fff",
            padding: "14px 24px",
            borderRadius: "10px",
            boxShadow: "0 10px 25px rgba(0,0,0,.3)",
            zIndex: "999999",
            fontWeight: "700",
            fontSize: "14px",
            textAlign: "center",
            minWidth: "280px",
            maxWidth: "calc(100% - 30px)"
        });

        document.body.appendChild(t);

        setTimeout(function () {
            if (t && t.parentNode) t.remove();
            if (callback) callback();
        }, 1200);

    } catch (e) {
        console.log("Toast:", message);
        if (callback) callback();
    }
}

    await pageCloudSave("erp_system_users", users);

    renderUsersTable();

}

/* SAVE ALL SETTINGS */
async function executeSaveAll() {

    if (saveAllRunning) return;

    saveAllRunning = true;

    const button = $("saveAllButton");

    if (button) {
        button.disabled = true;
        button.style.opacity = "0.65";
        button.style.cursor = "wait";
    }

    try {

        saveProgress("Saving ERP settings...");
        status("Saving settings...");

        saveCloudToggleState();

        const heading = cleanInputText($("set_heading") ? $("set_heading").value : "");
        const addr = $("set_comp_addr") ? $("set_comp_addr").value.trim() : "";

        if (heading) safeSave("app_heading_name", heading);
        if (addr) safeSave("company_full_address", addr);

        if (tempLogoData) {
            const logo = normalizeImageData(tempLogoData);

            if (!logo) throw new Error("Invalid company logo.");
            if (getDataUrlBytes(logo) > MAX_IMAGE_BYTES) throw new Error("Company logo is too large.");

            safeSave("company_logo", logo);
            safeSave("company_logo_base64", logo);
            safeSave("logo", logo);
        }

        const select = $("settingDesignSelect");

        if (select && select.value && tempDesignBitmapData) {
            const specs = safeLoad("design_specs", {}) || {};
            const clean = String(select.value).replace("#", "").trim().toLowerCase();

            const key = Object.keys(specs).find(function (k) {
                return String(k).replace("#", "").trim().toLowerCase() === clean;
            }) || select.value;

            if (!specs[key] || typeof specs[key] !== "object") {
                specs[key] = {};
            }

            specs[key].bitmap = normalizeImageData(tempDesignBitmapData);

            safeSave("design_specs", specs);
        }

        status("✅ Settings saved locally");

        /* FIX #3: wait for the cloud uploads to finish BEFORE redirecting,
           otherwise the browser can cancel requests still in flight */
        if (typeof window.isCloudSyncActive === "function" && window.isCloudSyncActive()) {

            saveProgress("☁️ Syncing to cloud...");

            const cloudJobs = [];

            if (heading) cloudJobs.push(pageCloudSave("app_heading_name", heading));
            if (addr) cloudJobs.push(pageCloudSave("company_full_address", addr));

            if (tempLogoData) {
                cloudJobs.push(pageCloudSave("company_logo", normalizeImageData(tempLogoData)));
            }

            if (select && select.value && tempDesignBitmapData) {
                const specs = safeLoad("design_specs", {}) || {};
                cloudJobs.push(pageCloudSave("design_specs", specs));
            }

            const results = await Promise.allSettled(cloudJobs);
            console.log("TEX FOR EVER cloud sync completed:", results);
        }

        saveProgress("✅ Saved. Opening Dashboard...");

        window.location.replace("dashboard.html");

    } catch (e) {

        console.error("executeSaveAll ERROR:", e);

        status("❌ Save failed: " + e.message, false);
        hideSaveProgress();

        alert("Save Error:\n\n" + e.message + "\n\nYour local data has been protected.");

        saveAllRunning = false;

        if (button) {
            button.disabled = false;
            button.style.opacity = "1";
            button.style.cursor = "pointer";
        }

        return;
    }
}

/* BACKUP ALL DATA (JSON) - Android + Folder Backup */
async function backupAllData() {
    try {

        const idbData = await idbGetAll();
        const allData = { ...idbData };

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!allData[key]) {
                allData[key] = localStorage.getItem(key);
            }
        }

        const payload = {
            app: "TEX FOR EVER",
            version: "Settings Backup with IndexedDB",
            createdAt: new Date().toISOString(),
            data: allData
        };

        const jsonContent = JSON.stringify(payload, null, 2);

        const fileName = "texforever_erp_backup_" + new Date().toISOString().slice(0, 10) + ".json";

        /* ANDROID NATIVE BACKUP */
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TexforeverStorage) {

            const folderUri = localStorage.getItem("texforever_selected_folder_uri");

            if (!folderUri) {
                alert("Please select backup folder first!");
                if (typeof selectTexforeverFolder === "function") {
                    await selectTexforeverFolder();
                }
                return;
            }

            const base64Data = btoa(unescape(encodeURIComponent(jsonContent)));

            const result = await window.Capacitor.Plugins.TexforeverStorage.saveBackup({
                fileName: fileName,
                data: base64Data,
                folderUri: folderUri
            });

            if (result && result.success) {
                toast("ERP JSON Backup Saved Successfully!", true);
                return;
            }

            throw new Error("Android JSON backup failed");
        }

        /* NORMAL WEB / DESKTOP BACKUP */
        const blob = new Blob([jsonContent], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        toast("ERP JSON Backup Download Started!");

    } catch (e) {
        console.error("Backup Error:", e);
        alert("Backup Error: " + (e.message || e));
    }
}

/* BACKUP ALL DATA AS EXCEL (CSV) - Android + Folder Backup */
async function backupAllDataAsExcel() {
    try {

        const idbData = await idbGetAll();
        const allData = { ...idbData };

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!allData[key]) {
                allData[key] = localStorage.getItem(key);
            }
        }

        let csvContent = "Key,Value\r\n";

        for (const key of Object.keys(allData)) {

            let value = allData[key];

            if (typeof value !== "string") {
                value = JSON.stringify(value);
            }

            value = String(value).replace(/"/g, '""').replace(/\r?\n/g, ' ');

            csvContent += '"' + String(key).replace(/"/g, '""') + '","' + value + '"\r\n';
        }

        const fileName = "texforever_erp_backup_" + new Date().toISOString().slice(0, 10) + ".csv";

        /* ANDROID NATIVE BACKUP */
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TexforeverStorage) {

            const folderUri = localStorage.getItem("texforever_selected_folder_uri");

            if (!folderUri) {
                toast("Please select backup folder first!", false);
                if (typeof selecttecforeverFolder === "function") {
                    selectTexforeverFolder();
                }
                return;
            }

            const base64Data = btoa(unescape(encodeURIComponent(csvContent)));

            const result = await window.Capacitor.Plugins.TexforeverStorage.saveBackup({
                fileName: fileName,
                data: base64Data,
                folderUri: folderUri
            });

            if (result && result.success) {
                toast("Excel/CSV Backup Saved Successfully!", true);
                return;
            }

            throw new Error("Android backup failed");
        }

        /* NORMAL WEB / DESKTOP BACKUP */
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        toast("Excel/CSV Backup Download Started!", true);

    } catch (e) {
        console.error("Excel Backup Error:", e);
        alert("Excel Backup Error: " + (e.message || e));
    }
}

/* LOAD STORAGE JSON */
async function loadStorageDataToEditor() {
    const idbData = await idbGetAll();
    const allData = { ...idbData };

    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!allData[key]) {
            allData[key] = localStorage.getItem(key);
        }
    }

    const editor = $("advancedJsonEditor");

    if (editor) {
        editor.value = JSON.stringify(allData, null, 2);
    }

    toast("Database Loaded into JSON Editor!");
}

/* SAVE STORAGE JSON */
async function saveStorageDataFromEditor() {
    const editor = $("advancedJsonEditor");
    if (!editor) return;

    let parsed;

    try {
        parsed = JSON.parse(editor.value);
    } catch (e) {
        alert("Invalid JSON format!\n\nError: " + e.message);
        return;
    }

    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        alert("JSON root must be an object.");
        return;
    }

    if (!confirm("⚠️ Overwrite local database with these JSON changes?")) return;

    try {

        for (const key of Object.keys(parsed)) {

            const val = typeof parsed[key] === "string" ? parsed[key] : JSON.stringify(parsed[key]);

            localStorage.setItem(key, val);
            await idbSet(key, parsed[key]);
        }

        if (window.supabaseSave && window.isCloudSyncActive && window.isCloudSyncActive()) {

            for (const key of (window.erpCloudKeys || [])) {

                if (!(key in parsed)) continue;

                let value = parsed[key];

                if (typeof value === "string") {
                    try {
                        value = JSON.parse(value);
                    } catch (e) {}
                }

                await window.supabaseSave(key, value);
            }
        }

        toast("Database Updated Successfully!", true, function () {
            location.reload();
        });

    } catch (e) {
        console.error("Database Save Error:", e);
        alert("Database Save Error: " + e.message);
    }
}

/* INITIALISE SETTINGS */
async function initialiseSettings() {

    if (settingsInitialized) return;

    settingsInitialized = true;

    try {
        const idbData = await idbGetAll();

        for (const key in idbData) {
            if (!localStorage.getItem(key)) {
                localStorage.setItem(
                    key,
                    typeof idbData[key] === "string" ? idbData[key] : JSON.stringify(idbData[key])
                );
            }
        }
    } catch (e) {}

    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission to access settings. ❌");
        location.href = "dashboard.html";
        return;
    }

    /* HEADING */
    const heading = safeLoad("app_heading_name", "TEX FOR EVER");
    if ($("set_heading")) {
        $("set_heading").value = cleanInputText(heading);
    }

    /* ADDRESS */
    const address = safeLoad("company_full_address", "TEX FOR EVER ,Salem, Tamil Nadu.");
    if ($("set_comp_addr")) {
        $("set_comp_addr").value = String(address || "").replace(/\\n/g, "\n");
    }

    /* LOGO */
    tempLogoData = getStoredCompanyLogo();
    showCompanyLogo(tempLogoData);

    /* CLOUD AUTO-SYNC TOGGLE LOAD */
    const cloudToggle = $("cloudSyncToggle");
    if (cloudToggle) {
        const syncState = localStorage.getItem("erp_cloud_sync_enabled");
        cloudToggle.checked = (syncState !== "false");
    }

    /* COMMON DATABASE CONFIG */
    if ($("databaseProviderInput")) {
        $("databaseProviderInput").value = safeLoad("database_provider", "supabase");
    }

    if ($("supabaseUrlInput")) {
        $("supabaseUrlInput").value = safeLoad("database_server_url", safeLoad("custom_supabase_url", ""));
    }

    if ($("supabaseKeyInput")) {
        $("supabaseKeyInput").value = safeLoad("database_api_key", safeLoad("custom_supabase_key", ""));
    }

    /* OTHER DATA */
    loadDesignDropdownInSettings();
    loadPartyDropdown();
    loadUserPermissions();
    renderUsersTable();

    status("⚙️ Settings ready");
}

/* DOM READY */
window.addEventListener("DOMContentLoaded", function () {
    initialiseSettings();
});
</script>
