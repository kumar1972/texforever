name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Copy native plugin files
        run: |
          cp native/PrintPlugin.java android/app/src/main/java/com/texforever/
          cp native/MainActivity.java android/app/src/main/java/com/texforever/
     
      - name: Sync web files
        run: npx cap sync android
        
      - name: Set app icon from www/icon-512.png
        run: |
          pip install --quiet pillow
          python3 <<'EOF'
          from PIL import Image
          import os

          src = Image.open('www/icon-512.png').convert('RGBA')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}

          for density, s in sizes.items():
              folder = os.path.join(res, f'mipmap-{density}')
              os.makedirs(folder, exist_ok=True)
              resized = src.resize((s, s), Image.LANCZOS)
              for name in ['ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground']:
                  resized.save(os.path.join(folder, f'{name}.png'))
          print('Icons created')
          EOF

      - name: Restore keystore and add release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TEXFOREVER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TEXFOREVER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEXFOREVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEXFOREVER_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          python3 <<'EOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs' not in s:
              s = s.replace('android {', 'android {' + signing, 1)
          s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                     r'\1\n            signingConfig signingConfigs.release',
                     s, count=1)
          open(p, 'w').write(s)
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TEXFOREVER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEXFOREVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEXFOREVER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare renamed APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/texforever-apk.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: texforever-apk
          path: output/texforever-apk.apk
