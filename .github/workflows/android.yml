name: Build Android APK
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Bump version
        run: |
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Add documentfile dependency
        run: |
          python3 <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'documentfile' not in s:
              s = s.replace('dependencies {', 'dependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"', 1)
              open(p, 'w').write(s)
          print('documentfile dependency ready')
          EOF

      - name: Copy native plugin files
        run: |
          mkdir -p android/app/src/main/java/com/texforever
          cp native/PrintPlugin.java android/app/src/main/java/com/texforever/
          cp native/MainActivity.java android/app/src/main/java/com/texforever/
          cp native/TexforeverStoragePlugin.java android/app/src/main/java/com/texforever/

      - name: Sync web files
        run: npx cap sync android

      - name: Set app icon from www/icon-512.png
        run: |
          pip install --quiet pillow
          python3 <<'EOF'
          from PIL import Image, ImageDraw
          import os

          src = Image.open('www/icon-512.png').convert('RGBA')
          res = 'android/app/src/main/res'

          def padded(size, scale):
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              inner = int(size * scale)
              img = src.resize((inner, inner), Image.LANCZOS)
              off = (size - inner) // 2
              canvas.paste(img, (off, off), img)
              return canvas

          def round_version(img):
              mask = Image.new('L', img.size, 0)
              ImageDraw.Draw(mask).ellipse((0, 0, img.size[0], img.size[1]), fill=255)
              out = img.copy()
              out.putalpha(mask)
              return out

          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          adaptive = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}

          for d, s in legacy.items():
              folder = os.path.join(res, f'mipmap-{d}')
              os.makedirs(folder, exist_ok=True)
              icon = padded(s, 0.8)
              icon.save(os.path.join(folder, 'ic_launcher.png'))
              round_version(icon).save(os.path.join(folder, 'ic_launcher_round.png'))

          for d, s in adaptive.items():
              folder = os.path.join(res, f'mipmap-{d}')
              os.makedirs(folder, exist_ok=True)
              padded(s, 0.66).save(os.path.join(folder, 'ic_launcher_foreground.png'))

          print('Icons created')
          EOF

      - name: Check keystore secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TEXFOREVER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TEXFOREVER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Keystore secrets missing"
            exit 1
          fi

      - name: Restore keystore and add release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TEXFOREVER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TEXFOREVER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEXFOREVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEXFOREVER_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          python3 <<'EOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs' not in s:
              s = s.replace('android {', 'android {' + signing, 1)
          s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                     r'\1\n            signingConfig signingConfigs.release',
                     s, count=1)
          open(p, 'w').write(s)
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TEXFOREVER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TEXFOREVER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEXFOREVER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare renamed APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/texforever.apk
          echo "--- output folder ---"
          ls -la output/
    
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare debug APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/texforever-debug.apk
    
      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TexForever v1.0.${{ github.run_number }}
          files: output/texforever.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Publish debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v1.0.${{ github.run_number }}
          name: TexForever Debug v1.0.${{ github.run_number }}
          prerelease: true
          files: output/texforever-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}