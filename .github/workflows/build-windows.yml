name: Build Windows EXE
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Set EXE icon from www/icon-512.png
        shell: bash
        run: |
          python -m pip install pillow
          mkdir -p desktop/build
          python <<'EOF'
          from PIL import Image
          img = Image.open('www/icon-512.png').convert('RGBA')
          img.save('desktop/build/icon.ico',
                   sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
          print('icon.ico created')
          EOF
      - name: Build portable EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: TEX FOR EVER Desktop ${{ github.run_number }}
          files: desktop/dist/*.exe
